<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Antoine Giz — software developer focused on systems software, simulation and distributed systems. Selected personal projects and technical experiments." />
    <meta name="theme-color" content="#eeede8" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('mango77x-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#171b1c' : '#eeede8');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Antoine Giz — Software Engineering Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
